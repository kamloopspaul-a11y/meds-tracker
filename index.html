<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Meds" />
  <title>Meds</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f2f0eb;
      --surface:   #ffffff;
      --border:    #ddd9d0;
      --text:      #2c2c2c;
      --muted:     #888;
      --accent:    #4a7c59;
      --accent-bg: #e8f2ec;
      --red:       #c0392b;
      --radius:    14px;
      --shadow:    0 2px 10px rgba(0,0,0,0.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 40px;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1         { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.01em; }
    header .date-str  { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    /* All-done banner */
    .all-done-banner {
      background: var(--accent);
      color: #fff;
      text-align: center;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }
    .all-done-banner.show { display: block; }

    /* Notice area */
    .notices {
      padding: 16px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notice {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.85rem;
      line-height: 1.4;
      font-weight: 500;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .notice .notice-icon { flex-shrink: 0; font-size: 1rem; }
    .notice.amber { background: #fff8e6; border: 1px solid #f0a500; color: #7a4f00; }
    .notice.red   { background: #fdecea; border: 1px solid #c0392b; color: #7b1f1a; }

    /* Toggle cards */
    .cards {
      padding: 16px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s, border-color 0.2s;
    }
    .card.done { background: var(--accent-bg); border-color: var(--accent); }

    .card-label { flex: 1; }
    .card-label .med-name { font-size: 1rem; font-weight: 600; }
    .card-label .med-sub  { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
    .card-label .taken-time {
      font-size: 0.75rem; color: var(--accent);
      margin-top: 4px; font-weight: 500; display: none;
    }
    .card.done .taken-time { display: block; }

    .toggle-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .toggle-label { font-size: 0.78rem; color: var(--muted); min-width: 36px; text-align: right; }
    .card.done .toggle-label { color: var(--accent); font-weight: 600; }

    .toggle { position: relative; width: 54px; height: 30px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 30px;
      cursor: pointer; transition: background 0.25s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 24px; height: 24px;
      left: 3px; top: 3px;
      background: #fff; border-radius: 50%;
      transition: transform 0.25s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(24px); }
    input:disabled + .slider { cursor: default; opacity: 0.75; }

    .lock-icon { font-size: 1rem; display: none; color: var(--accent); }
    .card.done .lock-icon { display: inline; }

    /* Refill dates section */
    .refill-section { margin: 24px 16px 0; }
    .refill-section summary {
      font-size: 1rem; font-weight: 600; color: var(--muted);
      cursor: pointer; padding: 8px 0; user-select: none;
      list-style: none;
    }
    .refill-section summary::-webkit-details-marker,
    .refill-section summary::marker { display: none; }
    .refill-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .refill-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .refill-info { flex: 1; }
    .refill-info .refill-name { font-size: 0.9rem; font-weight: 600; }
    .refill-info .refill-due  { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
    .refill-info .refill-due.soon  { color: #e67e22; font-weight: 600; }
    .refill-info .refill-due.urgent { color: var(--red); font-weight: 600; }

    .refill-btn {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .refill-btn.state-filled {
      border-color: var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: default;
    }
    .refill-btn.state-renew {
      border-color: #f0a500;
      background: #fff8e6;
      color: #7a4f00;
    }
    .refill-btn.state-renew:active { background: #ffefc4; }
    .refill-btn.state-ordered {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--accent);
    }
    .refill-btn.state-ordered:active { background: #d0e8d8; }

    /* History */
    .history-section { margin: 24px 16px 0; }
    .history-section summary {
      font-size: 1rem; font-weight: 600; color: var(--muted);
      cursor: pointer; padding: 8px 0; user-select: none;
      list-style: none;
    }
    .history-section summary::-webkit-details-marker,
    .history-section summary::marker { display: none; }
    .history-table {
      width: 100%; border-collapse: collapse;
      margin-top: 10px; font-size: 0.78rem;
    }
    .history-table th {
      text-align: left; color: var(--muted); font-weight: 600;
      padding: 4px 6px; border-bottom: 1px solid var(--border);
    }
    .history-table td {
      padding: 5px 6px; border-bottom: 1px solid var(--border); color: var(--text);
    }
    .history-table tr:last-child td { border-bottom: none; }
    .dot-yes { color: var(--accent); font-weight: 700; }
    .dot-no  { color: var(--red);    font-weight: 700; }

    .history-loading { font-size: 0.8rem; color: var(--muted); padding: 8px 0; }
    .history-error   { font-size: 0.8rem; color: var(--red);   padding: 8px 0; }

    footer { text-align: center; margin-top: 36px; font-size: 0.72rem; color: var(--border); }
  </style>
</head>
<body>

<header>
  <h1>💊 Meds</h1>
  <div class="date-str" id="dateStr"></div>
</header>

<div class="all-done-banner" id="allDoneBanner">✓ All meds taken today</div>

<div class="notices" id="noticeArea"></div>

<div class="cards">

  <div class="card" id="card-thyroid">
    <div class="card-label">
      <div class="med-name">Thyroid</div>
      <div class="med-sub">Methimazole + Propranolol — once daily, morning</div>
      <div class="taken-time" id="time-thyroid"></div>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="label-thyroid">—</span>
      <span class="lock-icon">🔒</span>
      <label class="toggle">
        <input type="checkbox" id="tog-thyroid" onchange="handleToggle('thyroid')" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card" id="card-am-inhalers">
    <div class="card-label">
      <div class="med-name">A.M. Inhalers</div>
      <div class="med-sub">Inspiolto + Pulmicort — morning</div>
      <div class="taken-time" id="time-am-inhalers"></div>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="label-am-inhalers">—</span>
      <span class="lock-icon">🔒</span>
      <label class="toggle">
        <input type="checkbox" id="tog-am-inhalers" onchange="handleToggle('am-inhalers')" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card" id="card-pm-inhalers">
    <div class="card-label">
      <div class="med-name">P.M. Inhalers</div>
      <div class="med-sub">Inspiolto + Pulmicort — evening</div>
      <div class="taken-time" id="time-pm-inhalers"></div>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="label-pm-inhalers">—</span>
      <span class="lock-icon">🔒</span>
      <label class="toggle">
        <input type="checkbox" id="tog-pm-inhalers" onchange="handleToggle('pm-inhalers')" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

</div>

<!-- Refill Dates -->
<div class="refill-section">
  <details id="refillDetails">
    <summary>▸ Refill Dates</summary>
    <div class="refill-list" id="refillList"></div>
  </details>
</div>

<!-- History -->
<div class="history-section">
  <details id="historyDetails">
    <summary>▸ History (last 14 days)</summary>
    <div id="historyContent" class="history-loading">Loading…</div>
  </details>
</div>

<footer>Meds v2.6</footer>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJnG-4pevm-343Cw9Vi-lIgNwtnDrcPEG2Icl0HFG5QSAB0DTC2ooZKmCEUdlmuEp4Bw/exec';

  // ── Refill config (seed data — only used on first run) ────────────────────────
  // nextRefill is seeded into localStorage on first load.
  // After that, the "Picked up" button advances it — no code changes needed.
  const REFILLS = [
    { id: 'thyroid',   name: 'Thyroid Meds',        daysSupply: 90,  nextRefill: '2026-07-15', renewable: true,  doctor: null },
    { id: 'inspiolto', name: 'Inspiolto Respimat',   daysSupply: 30,  nextRefill: '2026-06-28', renewable: false, doctor: 'Dr. Jones' },
    { id: 'pulmicort', name: 'Pulmicort Turbuhaler', daysSupply: 100, nextRefill: '2026-07-28', renewable: false, doctor: 'Dr. Jones' }
  ];

  const THRESH_RX_AMBER = 20;
  const THRESH_RX_RED   = 7;
  const THRESH_PHARMACY = 7;

  const MEDS = ['thyroid', 'am-inhalers', 'pm-inhalers'];

  // ── Helpers ───────────────────────────────────────────────────────────────────
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function timeStr()  { return new Date().toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' }); }

  function friendlyDate(d) {
    return new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function daysUntil(dateStr) {
    const today  = new Date(todayStr() + 'T00:00:00');
    const target = new Date(dateStr   + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }

  function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T12:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  // ── Refill date storage ───────────────────────────────────────────────────────
  function loadRefillDates() {
    const stored = JSON.parse(localStorage.getItem('refillDates') || '{}');
    // Seed any missing entries from config defaults
    let seeded = false;
    REFILLS.forEach(med => {
      if (!stored[med.id]) { stored[med.id] = med.nextRefill; seeded = true; }
    });
    if (seeded) localStorage.setItem('refillDates', JSON.stringify(stored));
    return stored;
  }

  function saveRefillDates(dates) {
    localStorage.setItem('refillDates', JSON.stringify(dates));
  }

  // ── Refill status: Filled → Renew Meds → Ordered → Filled ────────────────────
  const THRESH_RENEW = 20; // days before due that "Renew Meds" auto-activates

  function loadRefillStatus() {
    const stored = JSON.parse(localStorage.getItem('refillStatus') || '{}');
    let seeded = false;
    REFILLS.forEach(med => {
      if (!stored[med.id]) { stored[med.id] = 'filled'; seeded = true; }
    });
    if (seeded) localStorage.setItem('refillStatus', JSON.stringify(stored));
    return stored;
  }

  function saveRefillStatus(status) {
    localStorage.setItem('refillStatus', JSON.stringify(status));
  }

  function advanceRefillStatus(id) {
    const status = loadRefillStatus();
    const dates  = loadRefillDates();
    const med    = REFILLS.find(m => m.id === id);
    if (!med) return;

    if (status[id] === 'renew') {
      status[id] = 'ordered';
    } else if (status[id] === 'ordered') {
      status[id] = 'filled';
      dates[id] = addDays(dates[id], med.daysSupply);
      saveRefillDates(dates);
    } else {
      return; // 'filled' is dimmed/inert — only the date threshold advances it
    }
    saveRefillStatus(status);
    renderRefillList();
    renderNotices();
  }

  // ── Notices ───────────────────────────────────────────────────────────────────
  function renderNotices() {
    const area  = document.getElementById('noticeArea');
    const dates = loadRefillDates();
    const out   = [];

    REFILLS.forEach(med => {
      const days = daysUntil(dates[med.id]);

      if (days < 0) {
        out.push({ cls: 'red', icon: '❗',
          text: `${med.name} refill is ${Math.abs(days)} day${Math.abs(days)===1?'':'s'} overdue — call Safeway today.` });
        return;
      }

      if (!med.renewable && med.doctor) {
        if (days <= THRESH_RX_RED) {
          out.push({ cls: 'red', icon: '🚨',
            text: `Call ${med.doctor} urgently — ${med.name} is non-renewable and due in ${days} day${days===1?'':'s'}. New Rx required.` });
        } else if (days <= THRESH_RX_AMBER) {
          out.push({ cls: 'amber', icon: '⚠️',
            text: `Call ${med.doctor} — ${med.name} renewal in ${days} days. Non-renewable Rx: book soon (allow time for blood tests if needed).` });
        }
      }

      if (days <= THRESH_PHARMACY) {
        out.push({ cls: 'red', icon: '💊',
          text: `Call Safeway — ${med.name} refill due in ${days} day${days===1?'':'s'}.` });
      }
    });

    area.innerHTML = out.map(n =>
      `<div class="notice ${n.cls}"><span class="notice-icon">${n.icon}</span><span>${n.text}</span></div>`
    ).join('');
  }

  // ── Refill list ───────────────────────────────────────────────────────────────
  const REFILL_STATUS_LABELS = {
    filled:  { text: 'Filled',     cls: 'state-filled'  },
    renew:   { text: 'Renew Meds', cls: 'state-renew'   },
    ordered: { text: 'Ordered',    cls: 'state-ordered' }
  };

  function renderRefillList() {
    const list   = document.getElementById('refillList');
    const dates  = loadRefillDates();
    const status = loadRefillStatus();

    // Auto-advance Filled → Renew Meds once within the renewal window
    let changed = false;
    REFILLS.forEach(med => {
      if (status[med.id] === 'filled' && daysUntil(dates[med.id]) <= THRESH_RENEW) {
        status[med.id] = 'renew';
        changed = true;
      }
    });
    if (changed) saveRefillStatus(status);

    list.innerHTML = REFILLS.map(med => {
      const days     = daysUntil(dates[med.id]);
      const friendly = friendlyDate(dates[med.id]);
      let dueClass   = '';
      let dueLabel   = `Next refill: ${friendly}`;
      if (days < 0)              { dueClass = 'urgent'; dueLabel = `Overdue by ${Math.abs(days)} day${Math.abs(days)===1?'':'s'} — ${friendly}`; }
      else if (days <= THRESH_RX_RED)   { dueClass = 'urgent'; dueLabel = `Due in ${days} day${days===1?'':'s'} — ${friendly}`; }
      else if (days <= THRESH_RX_AMBER) { dueClass = 'soon';   dueLabel = `Due in ${days} days — ${friendly}`; }

      const st = REFILL_STATUS_LABELS[status[med.id]] || REFILL_STATUS_LABELS.filled;

      return `
        <div class="refill-row">
          <div class="refill-info">
            <div class="refill-name">${med.name}</div>
            <div class="refill-due ${dueClass}">${dueLabel}</div>
          </div>
          <button class="refill-btn ${st.cls}" onclick="advanceRefillStatus('${med.id}')">${st.text}</button>
        </div>`;
    }).join('');
  }

  document.getElementById('refillDetails').addEventListener('toggle', function () {
    if (this.open) renderRefillList();
  });

  // ── Meds state ────────────────────────────────────────────────────────────────
  function loadState() {
    const saved = JSON.parse(localStorage.getItem('medsState') || '{}');
    if (saved.date !== todayStr())
      return { date: todayStr(), thyroid: null, 'am-inhalers': null, 'pm-inhalers': null };
    return saved;
  }
  function saveState(s) { localStorage.setItem('medsState', JSON.stringify(s)); }

  function render(state) {
    document.getElementById('dateStr').textContent = friendlyDate(state.date);
    let allDone = true;
    MEDS.forEach(id => {
      const taken  = state[id];
      const card   = document.getElementById('card-' + id);
      const tog    = document.getElementById('tog-' + id);
      const lbl    = document.getElementById('label-' + id);
      const timeEl = document.getElementById('time-' + id);
      if (taken) {
        card.classList.add('done');
        tog.checked = true; tog.disabled = true;
        lbl.textContent = 'Done';
        timeEl.textContent = 'Taken at ' + taken;
      } else {
        card.classList.remove('done');
        tog.checked = false; tog.disabled = false;
        lbl.textContent = '—'; timeEl.textContent = '';
        allDone = false;
      }
    });
    document.getElementById('allDoneBanner').classList.toggle('show', allDone);
  }

  function handleToggle(id) {
    if (!document.getElementById('tog-' + id).checked) return;
    const state = loadState();
    state[id] = timeStr();
    saveState(state);
    render(state);
    postToSheets(id, state[id], state.date);
  }

  // ── Apps Script POST ──────────────────────────────────────────────────────────
  function postToSheets(med, time, date) {
    if (!SCRIPT_URL) return;
    const labels = { thyroid: 'Thyroid', 'am-inhalers': 'AM Inhalers', 'pm-inhalers': 'PM Inhalers' };
    // Note: Content-Type is deliberately 'text/plain' (not 'application/json').
    // Apps Script web apps don't handle CORS preflight (OPTIONS) requests, so a
    // POST with an 'application/json' header triggers a preflight that fails —
    // the browser blocks the real request with "Failed to fetch" and nothing
    // is ever logged. 'text/plain' is a CORS-"simple" content type, so no
    // preflight is sent; Apps Script's e.postData.contents is still the raw
    // JSON string and JSON.parse() in doPost works exactly the same.
    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ date, time, med: labels[med] })
    }).catch(() => {});
  }

  // ── History ───────────────────────────────────────────────────────────────────
  document.getElementById('historyDetails').addEventListener('toggle', function () {
    if (this.open) loadHistory();
  });

  function loadHistory() {
    const el = document.getElementById('historyContent');
    if (!SCRIPT_URL) {
      el.innerHTML = '<div class="history-error">Apps Script URL not set.</div>'; return;
    }
    el.innerHTML = '<div class="history-loading">Loading…</div>';
    fetch(SCRIPT_URL + '?action=history&days=14&_=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(data => renderHistory(data, el))
      .catch(() => { el.innerHTML = '<div class="history-error">Could not load history.</div>'; });
  }

  function renderHistory(rows, el) {
    if (!rows || !rows.length) { el.innerHTML = '<div class="history-loading">No history yet.</div>'; return; }
    const byDate = {};
    rows.forEach(r => { if (!byDate[r.date]) byDate[r.date] = {}; byDate[r.date][r.med] = r.time; });
    const dates = Object.keys(byDate).sort().reverse();
    const cols  = ['Thyroid', 'AM Inhalers', 'PM Inhalers'];
    let html = '<table class="history-table"><thead><tr><th>Date</th>';
    cols.forEach(c => { html += `<th>${c}</th>`; });
    html += '</tr></thead><tbody>';
    dates.forEach(d => {
      html += `<tr><td>${friendlyDate(d)}</td>`;
      cols.forEach(c => {
        html += byDate[d][c] ? `<td class="dot-yes">✓ ${byDate[d][c]}</td>` : `<td class="dot-no">—</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  loadRefillDates(); // seed localStorage on first run
  renderNotices();
  render(loadState());
</script>
</body>
</html>
